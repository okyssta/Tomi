name: Feature request
description: Suggest a Tomi improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Keep requests focused on the user problem. Tomi is offline-first and avoids ads, accounts, and unnecessary data collection.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: privacy
    attributes:
      label: Data and permission impact
      description: Would this add network access, health data, location, notifications, or storage?
  - type: textarea
    id: evidence
    attributes:
      label: Examples or mockups
