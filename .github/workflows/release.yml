name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate version tag
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease" >&2
            exit 1
          fi
          VERSION_CODE=$(python3 - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          core = re.match(r"^(\d+)\.(\d+)\.(\d+)", version)
          major, minor, patch = map(int, core.groups())
          print(major * 1_000_000 + minor * 1_000 + patch)
          PY
          )
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 packages
        shell: bash
        run: |
          sdkmanager --licenses < <(yes) >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tomi-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/tomi-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties "$RUNNER_TEMP/tomi-release.jks"

      - name: Test, lint, and build signed release
        run: >-
          ./gradlew testDebugUnitTest lintRelease assembleRelease
          -PVERSION_CODE="$VERSION_CODE"
          -PVERSION_NAME="$VERSION_NAME"
          --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tomi-release.apk
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/tomi-release.apk > dist/signature.txt
          cd dist
          sha256sum tomi-release.apk mapping.txt signature.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tomi-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Tomi ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
